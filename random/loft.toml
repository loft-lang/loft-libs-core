[package]
name = "random"
version = "0.4.0"
loft = ">=2026.10.0"

api_compatible_with  = "0.3.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.3.0"   # oldest own release whose stored data this reads
[library]
entry = "src/random.loft"

# The native part is C99, built by loft itself with `cc` — no Rust crate, no rustc.  The
# `#c` declarations in src/random.loft bind its symbols (PACKAGES_C_BINDING.md).
[c]
shim = "c/random.c"
