# @PLN179 strand 8 — the helpers a script needs that the standard library keeps out of
# itself: a recursive walk, a copy, a glob.  Every one is loft over the stdlib's primitives,
# which is why none of them is a stdlib function.

[package]
name    = "script"
version = "0.4.0"
description = "What a script reaches for, on demand: a recursive walk (lazy, or sorted), a copy, a glob, a set of texts — each a method that loads the library on use."
categories = ["cli"]
loft    = ">=2026.10.0"
repository = "loft-libs-core"

api_compatible_with  = "0.4.0"
data_compatible_with = "0.1.0"

[library]
entry = "src/script.loft"

# A script never writes `use script;`: the methods hang off `text`, so `dir.walk(".loft")`
# loads the library the way `line.matches(p)` loads regex.
[triggers]
enabled = true
# The BUILDERS: the few free functions a script may call bare — `set(words)` — that load the
# library the way a method does.  Explicit and short on purpose: the bare namespace is the
# program's, a definition of the same name in the program wins, and `script::set(…)` always
# reaches this one.
builders = ["set"]
