# @PLN179 strand 8 — the helpers a script needs that the standard library keeps out of
# itself: a recursive walk, a copy, a glob.  Every one is loft over the stdlib's primitives,
# which is why none of them is a stdlib function.

[package]
name    = "script"
version = "0.1.0"
loft    = ">=2026.10.0"

api_compatible_with  = "0.1.0"
data_compatible_with = "0.1.0"

[library]
entry = "src/script.loft"

# A script never writes `use script;`: the methods hang off `text`, so `dir.walk(".loft")`
# loads the library the way `line.matches(p)` loads regex.
[triggers]
enabled = true
