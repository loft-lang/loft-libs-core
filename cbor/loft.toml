[package]
name = "cbor"
version = "0.1.4"
description = "Signable canonical CBOR (RFC 8949), pure loft — canonical map-key ordering, full decode, byte-identical encode->decode->encode, native == wasm."
loft = ">=0.8"
api_compatible_with  = "0.1.1"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.1"   # oldest own release whose stored data this reads
repository = "loft-libs-core"

[library]
entry = "src/cbor.loft"

# Pure loft — no [native] crate. CBOR's byte format is encoded directly over
# vector<u8>, so the codec runs identically on every target (native == wasm by
# construction) with no FFI bridge and no external-crate trust surface.  See
# loft-lang/plans#83.

[triggers]
enabled = true
